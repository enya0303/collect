<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>美好生活收集冊</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #FFF9F9; }
    ::-webkit-scrollbar-thumb { background: #fecdd3; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #fda4af; }
    .fade-in { animation: fadeIn 0.5s ease-in-out forwards; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="bg-[#FFF9F9] text-slate-900 font-sans min-h-screen flex hidden" id="app-container">

  <aside class="w-20 lg:w-64 border-r border-rose-100 bg-white flex flex-col p-4 sticky top-0 h-screen transition-all">
    <div class="flex items-center gap-3 px-2 mb-10">
      <div class="w-10 h-10 bg-gradient-to-br from-rose-400 to-pink-500 rounded-xl flex items-center justify-center text-white shadow-inner">
        <i class="ph ph-sparkle text-2xl"></i>
      </div>
      <span class="font-bold text-xl tracking-tight text-rose-950 lg:block hidden">我的專屬選物</span>
    </div>

    <nav class="flex-1 space-y-2">
      <button onclick="switchTab('dashboard')" id="nav-dashboard" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all duration-200 bg-rose-500 text-white shadow-lg shadow-rose-200">
        <i class="ph ph-squares-four text-xl"></i>
        <span class="font-medium text-sm lg:block hidden">控制面板</span>
      </button>
      <button onclick="switchTab('collections')" id="nav-collections" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all duration-200 text-slate-500 hover:bg-rose-50 hover:text-rose-600">
        <i class="ph ph-package text-xl"></i>
        <span class="font-medium text-sm lg:block hidden">所有清單</span>
      </button>
    </nav>
    <div class="mt-auto pt-4 border-t border-rose-50">
       <button id="logout-btn" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all duration-200 text-slate-500 hover:bg-slate-50 hover:text-rose-600">
        <i class="ph ph-sign-out text-xl"></i>
        <span class="font-medium text-sm lg:block hidden">登出</span>
      </button>
    </div>
  </aside>

  <main class="flex-1 flex flex-col min-h-screen relative">
    <header class="h-20 bg-white/80 backdrop-blur-md border-b border-rose-100 flex items-center justify-between px-8 sticky top-0 z-10">
      <div class="relative w-full max-w-md">
        <i class="ph ph-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-rose-300 text-lg"></i>
        <input type="text" id="search-input" placeholder="搜尋甜點、服飾或標籤..." class="w-full bg-rose-50/50 border border-rose-100 rounded-2xl py-2.5 pl-10 pr-4 text-sm focus:ring-2 focus:ring-rose-400/30 transition-all outline-none">
      </div>
      <div class="flex items-center gap-3">
         <span id="user-name-display" class="text-sm font-medium text-slate-600"></span>
        <div class="h-10 w-10 rounded-full bg-rose-100 border-2 border-white shadow-sm overflow-hidden flex items-center justify-center text-rose-500">
          <i class="ph ph-user text-xl"></i>
        </div>
      </div>
    </header>

    <div class="p-8 max-w-7xl mx-auto w-full pb-24">
      <div id="view-dashboard" class="space-y-8 fade-in block">
        <div class="flex items-end justify-between">
          <div>
            <h1 class="text-3xl font-bold text-rose-950">美好生活收集冊 🌸</h1>
            <p class="text-rose-600/70 mt-2">目前您擁有 <span id="col-count">0</span> 個分類，共紀錄了 <span id="item-count">0</span> 件美好的事物。</p>
          </div>
          <button onclick="openModal('collection-modal')" class="bg-rose-500 hover:bg-rose-600 text-white px-6 py-3 rounded-2xl flex items-center gap-2 font-semibold shadow-lg shadow-rose-200 transition-all">
            <i class="ph ph-plus text-xl"></i><span>建立新分類</span>
          </button>
        </div>
        <div id="collections-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 mt-8"></div>
      </div>

      <div id="view-collections" class="space-y-6 fade-in hidden">
        <div class="flex items-center gap-4">
          <button onclick="switchTab('dashboard')" class="p-2 hover:bg-rose-100 text-rose-400 rounded-xl transition-colors">
            <i class="ph ph-caret-left text-2xl"></i>
          </button>
          <h1 id="current-collection-title" class="text-2xl font-bold text-slate-800">所有項目</h1>
        </div>
        <div id="items-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
      </div>
    </div>
  </main>

  <div id="login-overlay" class="fixed inset-0 z-[100] bg-[#FFF9F9] flex flex-col items-center justify-center fade-in">
    <div class="bg-white p-10 rounded-3xl shadow-xl text-center max-w-md w-full mx-4 border border-rose-50">
      <div class="w-16 h-16 bg-rose-100 rounded-2xl flex items-center justify-center text-rose-500 mx-auto mb-6">
         <i class="ph ph-sparkle text-3xl"></i>
      </div>
      <h1 class="text-3xl font-bold text-rose-950 mb-4">登入收集冊</h1>
      <p class="text-slate-500 mb-8">請先登入以查看您的專屬選物</p>
      <button id="login-btn" class="w-full bg-rose-500 hover:bg-rose-600 text-white font-bold py-3 px-6 rounded-2xl transition-all shadow-lg shadow-rose-200 flex items-center justify-center gap-2">
        <i class="ph ph-google-logo text-xl"></i>使用 Google 帳號登入
      </button>
    </div>
  </div>

  <div id="collection-modal" class="fixed inset-0 z-50 hidden items-center justify-center px-4">
    <div class="absolute inset-0 bg-slate-900/20 backdrop-blur-sm" onclick="closeModal('collection-modal')"></div>
    <div class="bg-white w-full max-w-lg rounded-3xl shadow-2xl relative fade-in p-8 space-y-4">
      <h2 class="text-xl font-bold text-slate-800">建立新分類 📁</h2>
      <input type="text" id="new-col-name" class="w-full bg-rose-50/50 border border-rose-100 rounded-xl px-4 py-3" placeholder="分類名稱">
      <select id="new-col-icon" class="w-full bg-rose-50/50 border border-rose-100 rounded-xl px-4 py-3 text-slate-700">
        <option value="ph-heart">甜點/愛好 (愛心)</option>
        <option value="ph-t-shirt">服飾穿搭 (衣服)</option>
        <option value="ph-coffee">咖啡/飲品 (杯子)</option>
      </select>
      <div class="pt-4 flex gap-3">
        <button onclick="closeModal('collection-modal')" class="flex-1 px-6 py-3 border border-rose-200 text-rose-500 rounded-2xl font-semibold">取消</button>
        <button id="save-col-btn" class="flex-1 px-6 py-3 bg-rose-500 text-white rounded-2xl font-semibold">建立</button>
      </div>
    </div>
  </div>

  <div id="item-modal" class="fixed inset-0 z-50 hidden items-center justify-center px-4">
    <div class="absolute inset-0 bg-slate-900/20 backdrop-blur-sm" onclick="closeModal('item-modal')"></div>
    <div class="bg-white w-full max-w-lg rounded-3xl shadow-2xl relative fade-in p-8 space-y-4 max-h-[80vh] overflow-y-auto">
      <h2 class="text-xl font-bold text-slate-800">加入新事物 ✨</h2>
      <input type="text" id="new-item-name" class="w-full bg-rose-50/50 border border-rose-100 rounded-xl px-4 py-3" placeholder="物品名稱">
      <div class="grid grid-cols-2 gap-4">
        <select id="new-item-col-id" class="w-full bg-rose-50/50 border border-rose-100 rounded-xl px-4 py-3"></select>
        <input type="text" id="new-item-price" class="w-full bg-rose-50/50 border border-rose-100 rounded-xl px-4 py-3" placeholder="價格 NT$">
      </div>
      <input type="text" id="new-item-tags" class="w-full bg-rose-50/50 border border-rose-100 rounded-xl px-4 py-3" placeholder="標籤 (用逗號分隔)">
      <div class="pt-2">
        <label class="text-sm font-semibold text-slate-700 block">上傳照片 (Base64 / 限 500KB)</label>
        <input type="file" id="new-item-image" accept="image/*" class="w-full mt-2">
        <img id="image-preview" src="" class="hidden h-32 w-32 mt-4 object-cover rounded-xl shadow-sm border border-rose-100 mx-auto">
      </div>
      <div class="pt-4 flex gap-3">
        <button onclick="closeModal('item-modal')" class="flex-1 px-6 py-3 border border-rose-200 text-rose-500 rounded-2xl font-semibold">取消</button>
        <button id="save-item-btn" class="flex-1 px-6 py-3 bg-rose-500 text-white rounded-2xl font-semibold">儲存</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged, signInWithCustomToken, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // 取得環境變數與 Firebase 設定
    const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
        apiKey: "AIzaSyCH4HU68vK-79PhmnVCEpoQlxYeYr4YY7Y",
        authDomain: "collect-28921.firebaseapp.com",
        projectId: "collect-28921",
        storageBucket: "collect-28921.firebasestorage.app",
        messagingSenderId: "697671675107",
        appId: "1:697671675107:web:b617568aa1309eff8069d6",
    };
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'collect-app';

    // 初始化 Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const googleProvider = new GoogleAuthProvider();

    // 狀態變數
    let currentUserUid = null;
    let collectionsData = [];
    let itemsData = [];
    let currentCollectionFilter = null;
    let base64ImageString = '';

    // DOM 元素綁定
    const loginOverlay = document.getElementById('login-overlay');
    const appContainer = document.getElementById('app-container');
    const userNameDisplay = document.getElementById('user-name-display');
    const collectionsGrid = document.getElementById('collections-grid');
    const itemsGrid = document.getElementById('items-grid');
    const selectItemColId = document.getElementById('new-item-col-id');

    // ================= 1. 登入與權限 ================= //
    // 支援系統 Custom Token 驗證機制
    const initAuth = async () => {
        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
            try {
                await signInWithCustomToken(auth, __initial_auth_token);
            } catch (err) {
                console.error("Token login failed", err);
            }
        }
    };
    initAuth();

    document.getElementById('login-btn').addEventListener('click', async () => {
        try { await signInWithPopup(auth, googleProvider); } 
        catch (error) { alert("登入失敗，請重試。"); }
    });

    document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));

    onAuthStateChanged(auth, (user) => {
        if (user) {
            currentUserUid = user.uid;
            userNameDisplay.textContent = user.displayName || '收藏家';
            loginOverlay.classList.add('hidden');
            appContainer.classList.remove('hidden');
            setupRealtimeListeners(user.uid);
        } else {
            currentUserUid = null;
            loginOverlay.classList.remove('hidden');
            appContainer.classList.add('hidden');
        }
    });

    // ================= 2. 資料庫監聽與寫入 ================= //
    let unsubCols = null;
    let unsubItems = null;

    function setupRealtimeListeners(uid) {
        if(unsubCols) unsubCols();
        if(unsubItems) unsubItems();

        // 確保存入正確的私人資料路徑
        const colsRef = collection(db, 'artifacts', appId, 'users', uid, 'collections');
        const itemsRef = collection(db, 'artifacts', appId, 'users', uid, 'items');

        unsubCols = onSnapshot(colsRef, (snapshot) => {
            collectionsData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            document.getElementById('col-count').textContent = collectionsData.length;
            updateSelectOptions();
            renderDashboard();
        }, (error) => console.error("Collections error:", error));

        unsubItems = onSnapshot(itemsRef, (snapshot) => {
            itemsData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            document.getElementById('item-count').textContent = itemsData.length;
            renderDashboard();
            renderItems();
        }, (error) => console.error("Items error:", error));
    }

    // 新增分類
    document.getElementById('save-col-btn').addEventListener('click', async () => {
        const name = document.getElementById('new-col-name').value.trim();
        const icon = document.getElementById('new-col-icon').value;
        if (!name) return;

        const btn = document.getElementById('save-col-btn');
        btn.disabled = true;
        btn.textContent = '處理中...';

        try {
            await addDoc(collection(db, 'artifacts', appId, 'users', currentUserUid, 'collections'), {
                name, icon, color: 'bg-pink-400', createdAt: new Date().toISOString()
            });
            closeModal('collection-modal');
            document.getElementById('new-col-name').value = '';
        } catch (err) {
            alert('新增失敗');
        } finally {
            btn.disabled = false;
            btn.textContent = '建立';
        }
    });

    // 圖片 Base64 轉換
    const imageInput = document.getElementById('new-item-image');
    const imagePreview = document.getElementById('image-preview');
    imageInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (file && file.size <= 500 * 1024) {
            const reader = new FileReader();
            reader.onloadend = () => {
                base64ImageString = reader.result;
                imagePreview.src = base64ImageString;
                imagePreview.classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        } else if (file) {
            alert("圖片檔案過大！請選擇小於 500KB 的圖片。");
            e.target.value = '';
        }
    });

    // 新增物品
    document.getElementById('save-item-btn').addEventListener('click', async () => {
        const name = document.getElementById('new-item-name').value.trim();
        const colId = document.getElementById('new-item-col-id').value;
        const price = document.getElementById('new-item-price').value.trim();
        const tagsStr = document.getElementById('new-item-tags').value.trim();
        
        if (!name || !colId) return alert("名稱和分類為必填！");

        const btn = document.getElementById('save-item-btn');
        btn.disabled = true;
        btn.textContent = '處理中...';

        const defaultImage = 'https://image.pollinations.ai/prompt/pink_fluffy_cotton_candy_on_a_stick_dessert?width=400&height=400&nologo=true';

        try {
            await addDoc(collection(db, 'artifacts', appId, 'users', currentUserUid, 'items'), {
                name, collectionId: colId, price: price || '未定價',
                tags: tagsStr ? tagsStr.split(',').map(t => t.trim()) : ['新加入'],
                image: base64ImageString || defaultImage,
                status: '剛入庫', date: new Date().toISOString().split('T')[0]
            });
            
            closeModal('item-modal');
            document.getElementById('new-item-name').value = '';
            document.getElementById('new-item-price').value = '';
            document.getElementById('new-item-tags').value = '';
            imageInput.value = '';
            imagePreview.classList.add('hidden');
            base64ImageString = '';
        } catch (err) {
            alert('儲存失敗');
        } finally {
            btn.disabled = false;
            btn.textContent = '儲存';
        }
    });

    // ================= 3. 畫面渲染與 UI 控制 ================= //
    function renderDashboard() {
        collectionsGrid.innerHTML = '';
        collectionsData.forEach(col => {
            const itemCount = itemsData.filter(item => item.collectionId === col.id).length;
            const card = document.createElement('div');
            card.className = "bg-white rounded-3xl border border-rose-100 shadow-sm hover:shadow-xl transition-all cursor-pointer p-6";
            card.onclick = () => openCollection(col.id, col.name);
            card.innerHTML = `
                <i class="ph ${col.icon} text-4xl text-rose-400 mb-4 block"></i>
                <h3 class="font-bold text-lg text-slate-800">${col.name}</h3>
                <p class="text-sm text-rose-500 mt-2">${itemCount} 件商品</p>
            `;
            collectionsGrid.appendChild(card);
        });
    }

    function renderItems() {
        itemsGrid.innerHTML = '';
        let filtered = itemsData;
        if (currentCollectionFilter) {
            filtered = itemsData.filter(item => item.collectionId === currentCollectionFilter);
        }
        
        const searchTerm = document.getElementById('search-input').value.toLowerCase();
        if (searchTerm) {
            filtered = filtered.filter(item => item.name.toLowerCase().includes(searchTerm));
        }

        itemsGrid.innerHTML += `
            <button onclick="openModal('item-modal')" class="border-2 border-dashed border-rose-200 rounded-3xl p-8 text-rose-400 hover:bg-rose-50 transition-all flex flex-col items-center justify-center h-[280px]">
                <i class="ph ph-plus text-3xl mb-2"></i><span class="font-semibold">新增項目</span>
            </button>
        `;

        filtered.forEach(item => {
            const card = document.createElement('div');
            card.className = "bg-white rounded-3xl border border-rose-100 shadow-sm overflow-hidden h-[280px] flex flex-col";
            card.innerHTML = `
                <div class="h-40 bg-rose-50"><img src="${item.image}" class="w-full h-full object-cover"></div>
                <div class="p-4 flex flex-col justify-between flex-1">
                    <h4 class="font-bold text-slate-800 truncate">${item.name}</h4>
                    <div class="flex justify-between items-center mt-2">
                        <span class="text-xs text-slate-400 bg-slate-50 px-2 py-1 rounded">${item.status}</span>
                        <span class="font-bold text-rose-500">${item.price}</span>
                    </div>
                </div>
            `;
            itemsGrid.appendChild(card);
        });
    }

    function updateSelectOptions() {
        selectItemColId.innerHTML = '<option value="" disabled selected>請選擇分類...</option>';
        collectionsData.forEach(col => {
            const option = document.createElement('option');
            option.value = col.id;
            option.textContent = col.name;
            selectItemColId.appendChild(option);
        });
        if (currentCollectionFilter) selectItemColId.value = currentCollectionFilter;
    }

    document.getElementById('search-input').addEventListener('input', () => {
        if (!document.getElementById('view-collections').classList.contains('hidden')) renderItems();
        else switchTab('collections');
    });

    // 暴露給 HTML onClick 呼叫的 UI 全域函數
    window.switchTab = function(tabId) {
        document.getElementById('view-dashboard').classList.add('hidden');
        document.getElementById('view-collections').classList.add('hidden');
        document.getElementById('view-' + tabId).classList.remove('hidden');
        
        if (tabId === 'dashboard') currentCollectionFilter = null;
        else if (tabId === 'collections' && !currentCollectionFilter) {
            document.getElementById('current-collection-title').textContent = '所有項目';
            renderItems();
        }
    };

    window.openCollection = function(colId, colName) {
        currentCollectionFilter = colId;
        document.getElementById('current-collection-title').textContent = colName;
        updateSelectOptions();
        switchTab('collections');
        renderItems();
    };

    window.openModal = (id) => {
        document.getElementById(id).classList.remove('hidden');
        document.getElementById(id).classList.add('flex');
    };

    window.closeModal = (id) => {
        document.getElementById(id).classList.add('hidden');
        document.getElementById(id).classList.remove('flex');
    };
  </script>
</body>
</html>
